<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>JARBISS — IA Pessoal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #eafaff;
      min-height: 100vh;
    }
    header {
      padding: 22px;
      text-align: center;
      border-bottom: 1px solid #17354b;
    }
    header h1 {
      margin: 0;
      color: #45e4ff;
      letter-spacing: 5px;
    }
    header p { color: #8da9bb; font-size: 13px; }
    main {
      max-width: 760px;
      margin: auto;
      padding: 20px;
    }
    .orb {
      width: 110px;
      height: 110px;
      margin: 25px auto;
      border-radius: 50%;
      background: radial-gradient(circle, #a6f8ff, #159acb 35%, #07111f 72%);
      box-shadow: 0 0 35px #159acb;
    }
    #status {
      text-align: center;
      color: #69edb1;
      font-size: 13px;
    }
    #chat {
      height: 42vh;
      min-height: 250px;
      overflow-y: auto;
      border: 1px solid #1c4057;
      border-radius: 14px;
      padding: 15px;
      background: #0a1827;
      margin-top: 22px;
    }
    .msg {
      padding: 12px 14px;
      margin: 10px 0;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { background: #123e56; margin-left: 25px; }
    .bot { background: #102638; margin-right: 25px; }
    form { display: flex; gap: 8px; margin-top: 14px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #24516a;
      background: #0a1827;
      color: white;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: #37d9f5;
      color: #04111c;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .actions { display: flex; gap: 10px; margin-top: 12px; }
    .actions button { flex: 1; }
