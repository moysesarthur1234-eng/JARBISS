
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>JARBISS — IA Pessoal</title>

  <style>
    :root {
      --bg: #050b14;
      --panel: #0b1625;
      --border: #18334a;
      --cyan: #42e5ff;
      --text: #e9f7ff;
      --muted: #8ba5ba;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #102b43 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    button, input {
      font: inherit;
    }

    .app {
      max-width: 1000px;
      min-height: 100vh;
      margin: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      margin: 0;
      color: var(--cyan);
      letter-spacing: 5px;
      font-size: 27px;
    }

    .subtitle {
      color: var(--muted);
      margin: 7px 0 0;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .badge {
      color: #83f5bd;
      border: 1px solid #20543f;
      background: #0c241d;
      border-radius: 30px;
      padding: 8px 12px;
      font-size: 12px;
      white-space: nowrap;
    }

    .hero {
      text-align: center;
      padding: 22px 0 12px;
    }

    .orb {
      width: 116px;
      height: 116px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 40% 35%,
        #ffffff 0%,
        #a7f7ff 9%,
        #39d9ff 23%,
        #126aab 48%,
        #07111f 73%
      );
      box-shadow:
        0 0 25px #23caff77,
        0 0 65px #168ad944,
        inset 0 0 20px #ffffff66;
      animation: pulse 3s ease-in-out infinite;
    }

    .orb.speaking {
      box-shadow:
        0 0 40px #42e5ff,
        0 0 90px #168ad977;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .hero h2 {
      font-size: 19px;
      margin: 0 0 7px;
    }

    #status {
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
    }

    .chat-panel {
      flex: 1;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      background: #081421ef;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 50px #0005;
    }

    .chat-heading {
      padding: 14px 17px;
      border-bottom: 1px solid var(--border);
      color: var(--cyan);
      font-size: 12px;
      letter-spacing: 2px;
    }

    #chat {
      flex: 1;
      height: 34vh;
      min-height: 250px;
      max-height: 480px;
      overflow-y: auto;
      padding: 16px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 88%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .bot {
      background: #102638;
      border: 1px solid #1b4055;
      margin-right: auto;
    }

    .user {
      background: #123e56;
      border: 1px solid #20617c;
      margin-left: auto;
    }

    .msg-label {
      display: block;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--cyan);
      margin-bottom: 7px;
    }

    /* Formatação das respostas da IA */

    .msg-content p {
      margin: 8px 0;
      white-space: pre-wrap;
    }

    .msg-content p:first-child {
      margin-top: 0;
    }

    .msg-content p:last-child {
      margin-bottom: 0;
    }

    .msg-content h1,
    .msg-content h2,
    .msg-content h3 {
      color: var(--cyan);
      line-height: 1.35;
      margin: 16px 0 8px;
    }

    .msg-content h1 { font-size: 20px; }
    .msg-content h2 { font-size: 18px; }
    .msg-content h3 { font-size: 16px; }

    .msg-content strong {
      color: #ffffff;
    }

    .msg-content em {
      color: #bdefff;
    }

    .msg-content ul,
    .msg-content ol {
      padding-left: 22px;
      margin: 8px 0;
    }

    .msg-content li {
      margin: 5px 0;
    }

    .msg-content table {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
      white-space: normal;
    }

    .msg-content th,
    .msg-content td {
      border: 1px solid #28516a;
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
      min-width: 85px;
    }

    .msg-content th {
      background: #12364c;
      color: var(--cyan);
    }

    .msg-content tr:nth-child(even) td {
      background: #0b1c2b;
    }

    .msg-content br {
      display: block;
      content: "";
      margin-top: 5px;
    }

    .composer {
      display: flex;
      gap: 9px;
      padding: 13px;
      border-top: 1px solid var(--border);
      background: #07111d;
    }

    #message {
      flex: 1;
      width: 0;
      min-width: 0;
      padding: 14px;
      color: white;
      background: #0b1b2a;
      border: 1px solid #24445a;
      border-radius: 11px;
      outline: none;
    }

    #message:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px #42e5ff18;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 15px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #send {
      color: #03111a;
      background: var(--cyan);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
      color: var(--text);
      background: #102438;
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .actions button.active {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .tools button {
      flex: 1 1 140px;
      color: var(--text);
      background: #0b1b2a;
      border: 1px solid var(--border);
      font-size: 12px;
    }

    footer {
      text-align: center;
      color: #607c91;
      font-size: 11px;
      padding: 20px 0 5px;
    }

    @media (max-width: 560px) {
      .app { padding: 13px; }
      .brand { font-size: 22px; letter-spacing: 4px; }
      .badge { font-size: 10px; padding: 7px 9px; }
      .orb { width: 95px; height: 95px; }
      #chat { height: 36vh; padding: 11px; }
      .msg { max-width: 94%; }
      .composer { padding: 9px; gap: 7px; }
      #message { padding: 12px 10px; }
      #send { padding: 10px 12px; }
      .actions button { padding: 11px 6px; }
      .msg-content th,
      .msg-content td { padding: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }

/* JARBISS 2.0 — painel holográfico */
:root {
  --neon: #35dfff;
  --neon-soft: rgba(53, 223, 255, 0.18);
  --gold: #d8b36a;
  --gold-soft: rgba(216, 179, 106, 0.18);
  --active-accent: var(--neon);
  --active-glow: var(--neon-soft);
}

body {
  background:
    radial-gradient(ellipse at 50% 18%, #102435 0%, transparent 48%),
    #030609;
}

.app {
  max-width: 1240px;
}

.hero {
  position: relative;
  padding: 30px 0 24px;
}

.orb {
  position: relative;
  width: 150px;
  height: 150px;
  border: 1px solid var(--active-accent);
  background:
    radial-gradient(circle, #102633 0%, #07111b 48%, #030609 72%);
  box-shadow:
    0 0 12px var(--active-glow),
    0 0 32px var(--active-glow),
    inset 0 0 24px var(--active-glow);
}

.orb::before,
.orb::after {
  content: "";
  position: absolute;
  border: 1px solid var(--active-accent);
  border-radius: 50%;
  pointer-events: none;
}

.orb::before {
  inset: 9px;
  border-right-color: transparent;
  border-left-color: transparent;
  animation: jarbiss-spin 12s linear infinite;
}

.orb::after {
  inset: -9px;
  border-style: dashed;
  opacity: 0.65;
  animation: jarbiss-spin 24s linear infinite reverse;
}

@keyframes jarbiss-spin {
  to { transform: rotate(360deg); }
}

/* Modo dourado */
body[data-mode="civic"] {
  --active-accent: var(--gold);
  --active-glow: var(--gold-soft);
}

/* Painéis refinados */
.chat-panel {
  border-color: #244054;
  background: rgba(5, 13, 22, 0.94);
  box-shadow:
    0 0 30px rgba(0, 0, 0, 0.4),
    inset 0 0 24px rgba(53, 223, 255, 0.025);
}

.chat-heading {
  border-bottom-color: #244054;
}

#message {
  background: #060d15;
  border-color: #294357;
}

#message:focus {
  border-color: var(--active-accent);
  box-shadow: 0 0 14px var(--active-glow);
}

#send {
  background: var(--active-accent);
}

@media (max-width: 560px) {
  .orb {
    width: 120px;
    height: 120px;
  }
}

  </style>
</head>

<body>
  <div class="app">
    <header>
      <div>
        <h1 class="brand">JARBISS</h1>
        <p class="subtitle">INTELIGÊNCIA PESSOAL</p>
      </div>
      <div class="badge" id="connection">● INTERFACE ONLINE</div>
    </header>

    <section class="hero">
      <div class="orb" id="orb" aria-hidden="true"></div>
      <h2>À sua disposição.</h2>
      <div id="status" role="status">
        Sistema inicializado. Aguardando comando.
      </div>
    </section>

    <section class="chat-panel" aria-label="Conversa com JARBISS">
      <div class="chat-heading">CENTRAL DE COMUNICAÇÃO</div>

      <div id="chat" aria-live="polite">
        <div class="msg bot">
          <span class="msg-label">JARBISS</span>
          <div class="msg-content">
            Olá, parceiro! Sou o JARBISS, sua IA pessoal.
            Estou pronto para ajudar. O que vamos fazer hoje?
          </div>
        </div>
      </div>

      <form class="composer" id="form">
        <input
          id="message"
          type="text"
          placeholder="Digite seu comando..."
          autocomplete="off"
          aria-label="Mensagem para JARBISS"
          required
        >
        <button id="send" type="submit">Enviar</button>
      </form>
    </section>

    <div class="actions">
      <button type="button" id="voice">🔊 Voz: desligada</button>
      <button type="button" id="clear">↻ Nova conversa</button>
    </div>

    <div class="tools" aria-label="Ferramentas pessoais">
      <button type="button" id="notes">📝 Bloco de notas</button>
      <button type="button" id="history">💬 Histórico</button>
    </div>

    <footer>
      JARBISS • ASSISTENTE PESSOAL • SISTEMA WEB
    </footer>
  </div>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const chat = document.getElementById("chat");
    const statusText = document.getElementById("status");
    const connection = document.getElementById("connection");
    const voiceButton = document.getElementById("voice");
    const clearButton = document.getElementById("clear");
    const orb = document.getElementById("orb");
    const notesButton = document.getElementById("notes");
    const historyButton = document.getElementById("history");

    let voiceEnabled = false;
    const HISTORY_KEY = "jarbiss_history_v1";
    const NOTES_KEY = "jarbiss_notes_v1";

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveHistoryEntry(text, sender) {
      const history = loadHistory();
      history.push({ text: String(text), sender, time: new Date().toLocaleString("pt-BR") });
      // Mantém somente as 200 mensagens mais recentes.
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-200)));
    }

    // Converte texto Markdown em elementos HTML seguros.
    function escaparHTML(texto) {
      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatarTexto(texto) {
      return texto
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    function formatarResposta(texto) {
      const linhas = escaparHTML(texto).replace(/\r/g, "").split("\n");
      const resultado = [];

      let listaAtual = null;

      function fecharLista() {
        if (listaAtual) {
          resultado.push("</" + listaAtual + ">");
          listaAtual = null;
        }
      }

      function celulasTabela(linha) {
        return linha.trim()
          .replace(/^\|/, "")
          .replace(/\|$/, "")
          .split("|")
          .map(celula => celula.trim());
      }

      function separadorTabela(linha) {
        const celulas = celulasTabela(linha);
        return celulas.length > 0 &&
          celulas.every(c => /^:?-{3,}:?$/.test(c));
      }

      for (let i = 0; i < linhas.length; i++) {
        const linha = linhas[i];
        const limpa = linha.trim();

        // Tabelas Markdown
        if (
          limpa.includes("|") &&
          i + 1 < linhas.length &&
          linhas[i + 1].includes("|") &&
          separadorTabela(linhas[i + 1])
        ) {
          fecharLista();

          const cabecalhos = celulasTabela(linha);
          let tabela = "<table><thead><tr>";

          cabecalhos.forEach(celula => {
            tabela += "<th>" + formatarTexto(celula) + "</th>";
          });

          tabela += "</tr></thead><tbody>";

          i += 2;

          while (i < linhas.length && linhas[i].trim().includes("|")) {
            const atual = linhas[i].trim();

            if (!atual) break;

            const valores = celulasTabela(atual);

            tabela += "<tr>";

            for (let j = 0; j < cabecalhos.length; j++) {
              tabela += "<td>" +
                formatarTexto(valores[j] || "") +
                "</td>";
            }

            tabela += "</tr>";
            i++;
          }

          tabela += "</tbody></table>";
          resultado.push(tabela);
          i--;
          continue;
        }

        // Títulos: #, ## e ###
        const titulo = limpa.match(/^(#{1,3})\s+(.+)$/);

        if (titulo) {
          fecharLista();

          const nivel = titulo[1].length;

          resultado.push(
            "<h" + nivel + ">" +
            formatarTexto(titulo[2]) +
            "</h" + nivel + ">"
          );

          continue;
        }

        // Listas com marcadores
        const item = limpa.match(/^[-*+]\s+(.+)$/);

        if (item) {
          if (listaAtual !== "ul") {
            fecharLista();
            resultado.push("<ul>");
            listaAtual = "ul";
          }

          resultado.push(
            "<li>" + formatarTexto(item[1]) + "</li>"
          );

          continue;
        }

        // Listas numeradas
        const itemNumerado = limpa.match(/^\d+[.)]\s+(.+)$/);

        if (itemNumerado) {
          if (listaAtual !== "ol") {
            fecharLista();
            resultado.push("<ol>");
            listaAtual = "ol";
          }

          resultado.push(
            "<li>" + formatarTexto(itemNumerado[1]) + "</li>"
          );

          continue;
        }

        fecharLista();

        if (!limpa) {
          continue;
        }

        resultado.push(
          "<p>" + formatarTexto(linha) + "</p>"
        );
      }

      fecharLista();

      return resultado.join("");
    }

    function addMessage(text, sender) {
      const bubble = document.createElement("div");
      bubble.className = "msg " + sender;

      const label = document.createElement("span");
      label.className = "msg-label";
      label.textContent = sender === "user" ? "VOCÊ" : "JARBISS";

      const content = document.createElement("div");
      content.className = "msg-content";

      if (sender === "user") {
        content.textContent = text;
      } else {
        content.innerHTML = formatarResposta(text);
      }

      bubble.appendChild(label);
      bubble.appendChild(content);
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      saveHistoryEntry(text, sender);

      return bubble;
    }

    function speak(text) {
      if (!voiceEnabled || !("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      // Remove os símbolos Markdown antes da leitura em voz alta.
      const textoFalado = String(text)
        .replace(/^#{1,3}\s+/gm, "")
        .replace(/\*\*(.*?)\*\*/g, "$1")
        .replace(/\*(.*?)\*/g, "$1")
        .replace(/`([^`]+)`/g, "$1")
        .replace(/^\s*[-*+]\s+/gm, "")
        .replace(/^\s*\d+[.)]\s+/gm, "")
        .replace(/\|/g, " ");

      const utterance = new SpeechSynthesisUtterance(textoFalado);
      utterance.lang = "pt-BR";
      utterance.rate = 1;
      utterance.pitch = 0.95;

      utterance.onstart = () => orb.classList.add("speaking");
      utterance.onend = () => orb.classList.remove("speaking");
      utterance.onerror = () => orb.classList.remove("speaking");

      window.speechSynthesis.speak(utterance);
    }

    function extractReply(data) {
      if (typeof data === "string") return data;

      if (data && typeof data === "object") {
        if (typeof data.reply === "string") return data.reply;
        if (typeof data.response === "string") return data.response;
        if (typeof data.message === "string") return data.message;
        if (typeof data.content === "string") return data.content;

        const choice = data.choices && data.choices[0];

        if (
          choice &&
          choice.message &&
          typeof choice.message.content === "string"
        ) {
          return choice.message.content;
        }
      }

      return "";
    }

    async function sendMessage(message) {
      addMessage(message, "user");

      input.value = "";
      input.focus();

      sendButton.disabled = true;
      input.disabled = true;

      statusText.textContent = "Processando seu comando...";
      connection.textContent = "● PROCESSANDO";

      const waiting = addMessage(
        "Um instante, estou pensando...",
        "bot"
      );

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const raw = await response.text();
        let data;

        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error(
            "O servidor retornou uma resposta inválida."
          );
        }

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            "O servidor respondeu com erro " + response.status + "."
          );
        }

        const reply = extractReply(data);

        if (!reply) {
          throw new Error(
            "O servidor respondeu, mas não encontrei o texto da resposta."
          );
        }

        waiting.remove();
        addMessage(reply, "bot");

        statusText.textContent = "Comando concluído.";
        connection.textContent = "● INTERFACE ONLINE";

        speak(reply);

      } catch (error) {
        waiting.remove();

        addMessage(
          "Não consegui falar com o servidor de IA. " +
          error.message +
          " Verifique a configuração do servidor no Render.",
          "bot"
        );

        statusText.textContent = "Falha ao consultar a IA.";
        connection.textContent = "● VERIFICAR SERVIDOR";

      } finally {
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const message = input.value.trim();

      if (!message || sendButton.disabled) return;

      sendMessage(message);
    });

    voiceButton.addEventListener("click", function() {
      voiceEnabled = !voiceEnabled;

      voiceButton.textContent = voiceEnabled
        ? "🔊 Voz: ligada"
        : "🔊 Voz: desligada";

      voiceButton.classList.toggle("active", voiceEnabled);

      if (!voiceEnabled && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        orb.classList.remove("speaking");
      } else {
        speak("Voz ativada. Estou ouvindo, parceiro.");
      }
    });

    clearButton.addEventListener("click", function() {
      if (!confirm("Iniciar uma nova conversa? O histórico salvo continuará disponível. Esta ação limpa apenas a conversa exibida.")) return;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      chat.replaceChildren();

      addMessage(
        "Conversa reiniciada. Estou pronto para o próximo comando, parceiro!",
        "bot"
      );

      statusText.textContent = "Aguardando novo comando.";
      connection.textContent = "● INTERFACE ONLINE";

      input.value = "";
      input.focus();
      orb.classList.remove("speaking");
    });

    notesButton.addEventListener("click", function() {
      const atual = localStorage.getItem(NOTES_KEY) || "";
      const novo = prompt("BLOCO DE NOTAS JARBISS\n\nEscreva ou edite suas anotações. Para apagar tudo, deixe vazio e confirme.", atual);
      if (novo === null) return;
      if (!novo.trim()) {
        if (atual && !confirm("Tem certeza de que deseja apagar todas as anotações?")) return;
        localStorage.removeItem(NOTES_KEY);
        alert("Anotações apagadas.");
      } else {
        localStorage.setItem(NOTES_KEY, novo);
        alert("Anotação salva neste navegador!");
      }
    });

    historyButton.addEventListener("click", function() {
      const history = loadHistory();
      if (!history.length) {
        alert("Ainda não há mensagens salvas no histórico.");
        return;
      }
      const resumo = history.slice(-30).map(item =>
        "[" + item.time + "] " + (item.sender === "user" ? "VOCÊ" : "JARBISS") + ": " + item.text
      ).join("\n\n");
      alert("HISTÓRICO RECENTE (até 30 mensagens)\n\n" + resumo + "\n\nAs mensagens ficam salvas somente neste navegador.");
    });

    window.addEventListener("error", function() {
      statusText.textContent = "Ocorreu um erro na interface.";
    });
  </script>
  
  <button id="micButton" type="button" title="Falar por voz" style="position:fixed;bottom:24px;right:24px;z-index:9999;border:0;border-radius:50%;width:54px;height:54px;background:#16a34a;color:white;font-size:24px;cursor:pointer;">🎙️</button>
  <script>
    (function () {
      const mic = document.getElementById("micButton");
     const input = document.getElementById("message");
const form = document.getElementById("form");
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      mic.addEventListener("click", function () {
        if (!SpeechRecognition) {
          alert("O navegador não oferece suporte ao reconhecimento de voz. Tente no Google Chrome.");
          return;
        }

        if (!input || !form) {
          alert("Não encontrei o campo de mensagem ou o formulário do chat.");
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = "pt-BR";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        mic.textContent = "⏺️";
        recognition.onresult = function (event) {
          input.value = event.results[0][0].transcript;
          input.dispatchEvent(new Event("input", { bubbles: true }));
          form.requestSubmit();
        };

        recognition.onerror = function () {
          alert("Não consegui captar a voz. Confira a permissão do microfone.");
        };

        recognition.onend = function () {
          mic.textContent = "🎙️";
        };

        recognition.start();
      });
    })();
  </script>

</body>
</html>
